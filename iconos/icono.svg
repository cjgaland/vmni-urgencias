<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C5C"/>
      <stop offset="0.6" stop-color="#16697A"/>
      <stop offset="1" stop-color="#2A7F8E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#g)"/>

  <!-- silueta de cara impersonal, muy sutil -->
  <ellipse cx="256" cy="225" rx="138" ry="163" fill="#FFFFFF" opacity="0.10"/>
  <!-- orejas sugeridas -->
  <ellipse cx="114" cy="235" rx="14" ry="30" fill="#FFFFFF" opacity="0.08"/>
  <ellipse cx="398" cy="235" rx="14" ry="30" fill="#FFFFFF" opacity="0.08"/>

  <!-- arnés: cintas superiores e inferiores -->
  <path d="M202 212 L116 186" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M310 212 L396 186" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M204 296 L112 296" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M308 296 L400 296" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

  <!-- apoyo frontal -->
  <rect x="247" y="116" width="18" height="52" rx="9" fill="#FFFFFF"/>
  <ellipse cx="256" cy="112" rx="36" ry="14" fill="#FFFFFF"/>

  <!-- mascarilla oronasal -->
  <path d="M256 156
           C 294 164, 320 218, 325 262
           C 329 304, 302 338, 256 342
           C 210 338, 183 304, 187 262
           C 192 218, 218 164, 256 156 Z"
        fill="#FFFFFF"/>
  <!-- almohadillado interior -->
  <path d="M256 174
           C 285 181, 306 226, 310 262
           C 313 296, 292 322, 256 326
           C 220 322, 199 296, 202 262
           C 206 226, 227 181, 256 174 Z"
        fill="none" stroke="#BBD8DF" stroke-width="7"/>
  <!-- codo / puerto espiratorio -->
  <circle cx="256" cy="272" r="27" fill="#CFE6EB"/>
  <circle cx="256" cy="272" r="13" fill="#16697A"/>

  <!-- marca, sin solaparse con nada -->
  <text x="256" y="465" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="14">VMNI</text>
</svg>
